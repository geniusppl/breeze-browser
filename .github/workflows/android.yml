name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project zip
        run: |
          unzip -o smartcookieweb.zip
          cp -r smartcookieweb/. .
          rm -f smartcookieweb.zip
          rm -rf smartcookieweb

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Ensure Android SDK platform 37
        run: |
          sdkmanager "platforms;android-37" "build-tools;35.0.0" || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleScMainDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: smartcookie-debug
          path: app/build/outputs/apk/scMain/debug/*.apk
